<!DOCTYPE html>
<html>
<head>
    <title>My Notes</title>
</head>
<body>

    <h1>📝 My Notes</h1>

    <a href="{% url 'note_create' %}">+ Add New Note</a>

    <hr>

    {% if notes %}
        {% for note in notes %}
            <div>
                <h2>{{ note.title }}</h2>

                <p>{{ note.content }}</p>

                <small>Created: {{ note.created_at }}</small>

                <br><br>

                <a href="{% url 'note_edit' note.pk %}">Edit</a>

                <a href="{% url 'note_delete' note.pk %}">Delete</a>
            </div>

            <hr>
        {% endfor %}
    {% else %}
        <p>No notes yet. Create your first note!</p>
    {% endif %}

</body>
</html>
