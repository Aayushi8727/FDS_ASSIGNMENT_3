{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{% static 'notes/style.css' %}">
    <title>Delete Note</title>
</head>
<body>

    <h1>Delete Note</h1>

    <p>Are you sure you want to delete:</p>

    <h2>{{ note.title }}</h2>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>
    </form>

    <br>

    <a href="{% url 'note_list' %}">Cancel</a>

</body>
</html>
